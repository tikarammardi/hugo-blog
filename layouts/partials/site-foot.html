<footer class="site-foot column">
  {{- $sha := getenv "GITHUB_SHA" -}}
  <div class="site-foot__row">
    <span>© {{ now.Year }} {{ .Site.Params.author }}</span>
    <span class="sep" aria-hidden="true">·</span>
    <span>
      Powered by
      <a
        class="hugo"
        href="https://gohugo.io/"
        title="Built with Hugo"
        aria-label="Built with Hugo, the static site generator"
      >
        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          role="img"
          fill="currentColor"
        >
          <path
            d="M11.754 0a3.998 3.998 0 00-2.049.596L3.33 4.532a4.252 4.252 0 00-2.017 3.615v8.03c0 1.473.79 2.838 2.067 3.574l6.486 3.733a3.88 3.88 0 003.835.018l7.043-3.966a3.817 3.817 0 001.943-3.323V7.752a3.57 3.57 0 00-1.774-3.084L13.817.541a3.998 3.998 0 00-2.063-.54zm.022 1.674c.413-.006.828.1 1.2.315l7.095 4.127c.584.34.941.96.94 1.635v8.462c0 .774-.414 1.484-1.089 1.864l-7.042 3.966a2.199 2.199 0 01-2.179-.01l-6.485-3.734a2.447 2.447 0 01-1.228-2.123v-8.03c0-.893.461-1.72 1.221-2.19l6.376-3.935a2.323 2.323 0 011.19-.347zm-4.7 3.844V18.37h2.69v-5.62h4.46v5.62h2.696V5.518h-2.696v4.681h-4.46V5.518Z"
          />
        </svg>
      </a>
    </span>
  </div>
  <div class="site-foot__row">
    <span>
      Text is
      <a
        class="cc"
        href="https://creativecommons.org/licenses/by-sa/4.0/"
        title="Creative Commons Attribution-ShareAlike 4.0 International License"
      >
        <img
          src="{{ "img/cc-by-sa.png" | relURL }}"
          width="80"
          height="15"
          alt="CC BY-SA 4.0"
        />
      </a>
    </span>
    {{- if $sha }}
      <span class="sep" aria-hidden="true">·</span>
      <span>
        <a
          href="https://github.com/tikarammardi/hugo-blog/tree/{{ $sha | slice 0 7 }}"
          >Improve this page @ {{ $sha | slice 0 7 }}</a
        >
      </span>
    {{- end }}
    <span class="sep" aria-hidden="true">·</span>
    <span>
      <a
        class="rss"
        href="{{ "index.xml" | relURL }}"
        title="Subscribe via RSS"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 11a9 9 0 0 1 9 9h-2.5A6.5 6.5 0 0 0 4 13.5V11z" />
          <path d="M4 4a16 16 0 0 1 16 16h-2.5A13.5 13.5 0 0 0 4 6.5V4z" />
          <circle cx="5.5" cy="18.5" r="2" />
        </svg>
        RSS
      </a>
    </span>
  </div>
</footer>
