baseURL = 'tikarammardi.com'
locale = 'en-us'
title = 'Tikaram Mardi'

buildFuture = true

[taxonomies]
  tag = "tags"

# The footer's "Improve this page" link reads the commit SHA from the
# environment in CI; whitelist it for the getenv template function.
[security.funcs]
  getenv = ["^HUGO_", "^CI$", "^GITHUB_SHA$"]

[markup]
  [markup.goldmark.renderer]
    # Allow Markdown to include embedded HTML.
    unsafe = true

  # Classed Chroma output with no inline styles, so the site's own
  # "Cobalt" syntax theme (assets/scss/_syntax.scss) does the colouring.
  [markup.highlight]
    noClasses = false
    style = ""
    codeFences = true
    guessSyntax = true
    lineNos = false

[permalinks]
    posts = "/:filename/"

[params]
    author = "Tikaram Mardi"
    info = "Software engineer with a passion for learning and sharing knowledge."
    description = "Knowledge sharing and personal growth through software development."
    keywords = "blog,developer,personal,engineer,software,linux,homelab,proxmox"
    avatarurl = "images/avatar.jpeg"

    favicon_32 = "/images/favicon/favicon-32x32.png"
    favicon_16 = "/images/favicon/favicon-16x16.png"

    popularPosts = [
        "second-blog",
    ]

    photoWidths = [300, 600, 800, 1200]

# Social links
[[params.social]]
    name = "GitHub"
    weight = 1
    url = "https://github.com/tikarammardi/"

[[params.social]]
    name = "LinkedIn"
    weight = 3
    url = "https://www.linkedin.com/in/tikarammardi/"

# Menu links
[[menu.main]]
    name = "Blog"
    weight = 1
    url  = "/posts/"

[[menu.main]]
    name = "Projects"
    weight = 3
    url = "/projects/"

[[menu.main]]
    name = "About"
    weight = 6
    url = "/about/"
